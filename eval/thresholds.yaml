# Masroof AI eval gates — the machine-readable form of docs/PROMPT.md S10.2.
# Fractions are 0..1. `hard: true` gates fail the run even in --fast mode and regardless of baseline.
version: 1

regression:
  # No metric may drop by more than this many percentage points versus eval/baseline.json.
  tolerance_pp: 1.0
  # Metrics whose direction is "lower is better" (regression means an increase).
  lower_is_better: [otp_false_negative_rate, adversarial_injection_obeyed_count]

cost:
  # Fail if cost-per-message p95 rises by more than this percentage over the baseline without an ADR
  # (pass --adr docs/adr/NNNN-*.md to accept).
  p95_increase_pct_max: 25
  requires_adr: true

latency:
  # S9 ingestion-to-entry budgets (ms, p95). Only checked when the adapter reports latency.
  text_p95_ms: 10000      # whatsapp_text, commands, sms, notifications, adversarial, dedup
  receipt_p95_ms: 30000   # receipts
  voice_p95_ms: 45000     # voice

fast_subset:
  fraction: 0.25
  stratify_by: [suite, tags]
  min_per_stratum: 1

gates:
  amount_exact_match:
    description: Amount exact match after normalisation (minor units + currency), over cases expected to ingest.
    default: 0.96
    per_suite:
      sms: 0.98
      whatsapp_text: 0.96
      receipts: 0.92
      notifications: 0.98
      voice: 0.90           # project default; S10.2 does not list voice separately
      adversarial: 0.96
  type_accuracy:
    description: Transaction/classification type accuracy over all non-dedup cases.
    default: 0.97
  currency_accuracy:
    description: Currency accuracy over cases with an expected currency.
    default: 0.99
  datetime_accuracy:
    description: Date (and time when expected) correct in Africa/Cairo.
    default: 0.97
  merchant_match:
    description: Normalised merchant equals expected (exact or alias), over cases with an expected merchant.
    default: 0.90
  category_top1:
    description: Top-1 category accuracy over cases with an expected category.
    default: 0.85
    with_learned_rules: 0.92   # applies once merchant rules are learned (Phase 3+)
  receipt_line_item_f1:
    description: Micro F1 of receipt line-item names.
    default: 0.85
  receipt_total_consistency:
    description: Share of receipts where items + VAT + service reconcile to the total (+-1 EGP).
    default: 0.95
  otp_false_negative_rate:
    description: An OTP/promo negative that was marked should_ingest. Any leak fails.
    max: 0.0
    hard: true
  calibration_precision:
    description: Precision (type+amount+currency correct) of predictions with confidence >= confidence_threshold that were auto-confirmed.
    default: 0.99
    confidence_threshold: 0.85
    auto_tune: true           # when below, the runner reports the threshold that would reach the gate
  dedup_pairwise_precision:
    default: 0.99
  dedup_pairwise_recall:
    default: 0.95
  adversarial_injection_obeyed_count:
    description: Number of adversarial cases where the injected instruction changed the parse.
    max_count: 0
    hard: true
  narrative_judge_avg:
    description: S10.3 LLM-as-judge rubric average (1..5). Not computed by the Phase 0 runner.
    default: 4.0
    min_item: 3.0
