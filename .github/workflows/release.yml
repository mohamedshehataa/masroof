# Masroof — release (PROMPT.md S12).
#
# Two triggers, one file:
#   manual run on main (workflow_dispatch) -> `release-please` opens or updates
#                    the release PR (CHANGELOG + version bump); merging it
#                    creates the `vX.Y.Z` tag. Push to main runs nothing (2026-10-25).
#   push tag v*   -> signed release APK, versioned images (+ optional cosign),
#                    DB backup, production deploy, post-deploy smoke tests with
#                    automatic rollback, and the release assets (APK + SBOMs).
#
# Rules: only `make` targets (S8). Module jobs are gated through `detect`.
#
# ---------------------------------------------------------------------------
# SECRETS (Settings > Secrets and variables > Actions). Missing optional
# secrets skip their step with a notice; nothing here prints a secret.
#   ANTHROPIC_API_KEY          not used by this workflow (listed for completeness: pr/main/nightly)
#   ANDROID_KEYSTORE_B64       release keystore, base64 of the .jks  (optional: skips signed APK)
#   ANDROID_KEYSTORE_PASSWORD  keystore password                      (required with the keystore)
#   ANDROID_KEY_ALIAS          key alias inside the keystore           (required with the keystore)
#   ANDROID_KEY_PASSWORD       key password                           (required with the keystore)
#   PROD_SSH_KEY               private key of the deploy user on the Oracle VM  (optional: skips deploy)
#   PROD_HOST                  IP (or user@IP) of the Oracle VM                 (required with PROD_SSH_KEY)
#   PROD_DOMAIN                public name, e.g. masroof.duckdns.org            (required with PROD_SSH_KEY)
#                              Setup: docs/HOSTING.md
#   STAGING_SSH_KEY            used by main.yml, not here
#   STAGING_HOST               used by main.yml, not here
#   COSIGN_KEY                 cosign private key (PEM) to sign images  (optional: skips signing)
#   COSIGN_PASSWORD            password of COSIGN_KEY                   (optional)
#   RELEASE_PLEASE_TOKEN       optional PAT so the tag created by release-please triggers this
#                              workflow (events from GITHUB_TOKEN never trigger workflows)
# VARIABLES
#   PROD_URL                   public URL, used by `make smoke`
#   PROD_KNOWN_HOSTS           optional pinned `ssh-keyscan` output for PROD_HOST
#
# Image naming contract with the Makefile (infra/README.md): `make build-images`
# honours IMAGE_REGISTRY, IMAGE_TAG and IMAGE_PUSH=1 and produces
# ${IMAGE_REGISTRY}/masroof-backend:${IMAGE_TAG} and .../masroof-web:${IMAGE_TAG}.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  # release-please runs only on demand until the first real release (owner decision 2026-10-25:
  # no "Allow GitHub Actions to create pull requests" setting change). Tag pushes still release.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"
  MAKEFLAGS: --no-print-directory
  CI: "true"

jobs:
  # --------------------------------------------------------------------------
  release-please:
    name: Release PR / changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          release-type: simple

  # --------------------------------------------------------------------------
  detect:
    name: Detect modules + version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    outputs:
      backend: ${{ steps.mods.outputs.backend }}
      web: ${{ steps.mods.outputs.web }}
      android: ${{ steps.mods.outputs.android }}
      version: ${{ steps.mods.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: mods
        run: |
          flag() { if [ -f "$2" ]; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          flag backend backend/gradlew
          flag web     web/package.json
          flag android android/gradlew
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  apk-release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: detect
    if: needs.detect.outputs.android == 'true'
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      APP_VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - name: Skip notice
        if: env.ANDROID_KEYSTORE_B64 == ''
        run: |
          echo "::warning::ANDROID_KEYSTORE_B64 missing: skipping the signed release APK."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ANDROID_KEYSTORE_B64 != ''
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: env.ANDROID_KEYSTORE_B64 != ''
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: env.ANDROID_KEYSTORE_B64 != ''
      - name: Materialise keystore (outside the workspace)
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_B64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: make build-apk-release
      - name: Collect APK + SHA-256 (used by /api/app/android/latest)
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          mkdir -p release-assets
          find android -path '*/outputs/apk/release/*' -name '*.apk' -exec cp {} release-assets/ \;
          cd release-assets
          for f in *.apk; do mv "$f" "masroof-${APP_VERSION}-${f}"; done
          sha256sum ./*.apk > "masroof-${APP_VERSION}.apk.sha256"
          cat "masroof-${APP_VERSION}.apk.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.ANDROID_KEYSTORE_B64 != ''
        with:
          name: release-apk
          path: release-assets/
          if-no-files-found: error
          retention-days: 90
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # --------------------------------------------------------------------------
  images:
    name: Versioned images (+ cosign) and SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write # keyless fallback is not used; kept for future
    env:
      IMAGE_TAG: ${{ needs.detect.outputs.version }}
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      IMAGE_PUSH: "1"
      PLATFORMS: linux/amd64,linux/arm64 # Oracle Always Free hosts are Ampere ARM
      COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.detect.outputs.web == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        run: make build-images
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.COSIGN_KEY != ''
      - name: Sign images with cosign
        if: env.COSIGN_KEY != ''
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          for svc in masroof-backend masroof-web; do
            ref="${IMAGE_REGISTRY,,}/${svc}:${IMAGE_TAG}"
            if digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
              cosign sign --yes --key env://COSIGN_KEY "${ref%:*}@${digest}"
            else
              echo "::notice::image $ref not built; nothing to sign"
            fi
          done
      - name: SBOM (CycloneDX)
        run: make sbom
      - name: Collect SBOMs
        run: |
          mkdir -p release-sbom
          find . -type f \( -name 'bom.json' -o -name '*.cdx.json' -o -name '*.cdx.xml' \) \
            -not -path './release-sbom/*' -not -path '*/node_modules/*' | while read -r f; do
            cp "$f" "release-sbom/$(echo "$f" | sed 's#^\./##; s#/#__#g')"
          done
          ls -la release-sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: release-sbom/
          if-no-files-found: warn
          retention-days: 90

  # --------------------------------------------------------------------------
  deploy-prod:
    name: Backup, deploy prod, smoke (auto-rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect, images, apk-release]
    if: >-
      always()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.detect.outputs.backend == 'true'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    env:
      # Oracle Always Free host (docs/HOSTING.md). Missing secrets skip the deploy with a notice; values are never echoed.
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_DOMAIN: ${{ secrets.PROD_DOMAIN }}
      IMAGE_TAG: ${{ needs.detect.outputs.version }}
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      MASROOF_RELEASE_ACTIVE: "1" # the same flag the /release skill sets; guard-bash.sh checks it
    steps:
      - name: Skip notice
        if: env.PROD_SSH_KEY == '' || env.PROD_HOST == '' || env.PROD_DOMAIN == ''
        run: |
          echo "::warning::PROD_HOST / PROD_SSH_KEY / PROD_DOMAIN not all set: skipping the production deploy (see docs/HOSTING.md)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PROD_SSH_KEY != '' && env.PROD_HOST != '' && env.PROD_DOMAIN != ''
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        if: env.PROD_SSH_KEY != '' && env.PROD_HOST != '' && env.PROD_DOMAIN != ''
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}
      - name: Known hosts
        if: env.PROD_SSH_KEY != '' && env.PROD_HOST != '' && env.PROD_DOMAIN != ''
        env:
          KNOWN_HOSTS: ${{ vars.PROD_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
            echo "SSH_STRICT_HOSTKEY=yes" >> "$GITHUB_ENV" # pinned key: refuse anything else
          else
            echo "::warning::vars.PROD_KNOWN_HOSTS not set; trusting the host key on first use (TODO(owner): pin it)."
            ssh-keyscan -H "${PROD_HOST#*@}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
      - name: Backup database before deploying
        if: env.PROD_SSH_KEY != '' && env.PROD_HOST != '' && env.PROD_DOMAIN != ''
        run: make backup HOST="$PROD_HOST"
      # `make deploy-prod` pulls the images, brings the stack up, runs `make smoke URL=https://<domain>` and, when the
      # smoke test fails, rolls back to the previous tag on the server, re-runs the smoke test and exits non-zero.
      - name: Deploy to production, smoke, auto-rollback
        if: env.PROD_SSH_KEY != '' && env.PROD_HOST != '' && env.PROD_DOMAIN != ''
        run: make deploy-prod VERSION="$IMAGE_TAG" HOST="$PROD_HOST" DOMAIN="$PROD_DOMAIN"

  # --------------------------------------------------------------------------
  github-release:
    name: GitHub Release assets (APK + SBOMs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect, apk-release, images, deploy-prod]
    if: >-
      always()
      && startsWith(github.ref, 'refs/tags/v')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create the release if release-please did not, then upload assets
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
          if compgen -G "dist/*" >/dev/null; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "::notice::no release assets (no module built yet)"
          fi
