# Dependabot (PROMPT.md 12 + S9 "SCA ... Dependabot/Renovate on").
# Grouped weekly PRs so review load stays small. Dependabot cannot append the
# `[SDLC]` tag that scripts/quality/commit-msg-lint.sh requires: whoever
# squash-merges adds it to the merge title (e.g. `build(web): bump vite [SDLC]`).
# Directories that do not exist yet are harmless: Dependabot logs "no manifest"
# and skips them until the module lands.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Africa/Cairo
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message:
      prefix: "build(backend)"
      include: scope
    groups:
      spring:
        patterns: ["org.springframework*", "io.micrometer*"]
      test:
        patterns: ["org.junit*", "org.testcontainers*", "net.jqwik*", "org.assertj*", "org.mockito*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Africa/Cairo
    open-pull-requests-limit: 5
    labels: [dependencies, android]
    commit-message:
      prefix: "build(android)"
      include: scope
    groups:
      androidx:
        patterns: ["androidx*", "com.google.dagger*", "com.google.android*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.squareup*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Africa/Cairo
    open-pull-requests-limit: 5
    labels: [dependencies, web]
    commit-message:
      prefix: "build(web)"
      include: scope
    groups:
      react:
        patterns: ["react*", "@tanstack*"]
      tooling:
        patterns: ["vite*", "@vitejs*", "vitest*", "@playwright*", "eslint*", "typescript*", "prettier*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Africa/Cairo
    open-pull-requests-limit: 3
    labels: [dependencies, sdlc]
    commit-message:
      prefix: "build(scripts)"
      include: scope

  - package-ecosystem: pip
    directory: /eval
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Africa/Cairo
    open-pull-requests-limit: 3
    labels: [dependencies, eval]
    commit-message:
      prefix: "build(eval)"
      include: scope

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Africa/Cairo
    open-pull-requests-limit: 3
    labels: [dependencies, infra]
    commit-message:
      prefix: "build(infra)"
      include: scope

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Africa/Cairo
    open-pull-requests-limit: 3
    labels: [dependencies, backend]
    commit-message:
      prefix: "build(backend)"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Africa/Cairo
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions:
        patterns: ["*"]
