# Git hooks for commits made inside or outside Claude Code.
# Install once: npx lefthook install   (or: make bootstrap)
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: bash -c '. scripts/env.sh && gitleaks git --pre-commit --staged --redact --config .gitleaks.toml'
    shellcheck:
      glob: "*.sh"
      run: bash -c '. scripts/env.sh && shellcheck -x -S warning {staged_files}'
    prettier-web:
      root: "web/"
      glob: "*.{ts,tsx,js,json,css,md}"
      run: npx prettier --check {staged_files}
    ktlint:
      root: "android/"
      glob: "*.{kt,kts}"
      run: ./gradlew -q ktlintCheck
    spotless:
      root: "backend/"
      glob: "*.java"
      run: ./gradlew -q spotlessCheck
    no-env:
      glob: ".env*"
      exclude: ".env.example"
      run: bash -c 'echo "refusing to commit env files"; exit 1'

commit-msg:
  commands:
    conventional-with-story:
      run: bash scripts/quality/commit-msg-lint.sh {1}
