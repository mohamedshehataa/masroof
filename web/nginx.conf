# Static server for the Vite bundle (STORY-142). Unprivileged nginx listens on 8080; SPA fallback to index.html.
# Included in the http context (conf.d). Headers are set once at server level, never inside a location,
# so a later add_header can never silently drop the others (semgrep nginx header-redefinition).
server_tokens off;

map $uri $masroof_cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default    "no-cache";
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control $masroof_cache_control always;
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
