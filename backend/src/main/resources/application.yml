spring:
  application:
    name: masroof-backend
  jackson:
    deserialization:
      accept-float-as-int: false # amountMinor: 1e5 as a JSON float is a 400 (REQ-EXP-021)
    mapper:
      allow-coercion-of-scalars: false # amountMinor: "20000" or true is a 400, never coerced
  main:
    banner-mode: "off"
masroof:
  jwt:
    secret: ${MASROOF_JWT_SECRET:} # >= 32 random bytes; required under profile prod (JwtConfiguration)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:} # comma separated; '*' refused under prod
  bootstrap:
    admin-email: ${MASROOF_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${MASROOF_BOOTSTRAP_ADMIN_PASSWORD:}
server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:masroof}
    username: ${POSTGRES_USER:masroof}
    hikari:
      connection-timeout: 2000 # ms; /health answers 503 within 3 s when Postgres is down (REQ-OPS-020)
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 2 # pgjdbc, seconds
  flyway:
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
    baseline-on-migrate: false
---
# Local dev and tests only: an empty database password is tolerated when no deployment profile is active.
spring:
  config:
    activate:
      on-profile: "!prod"
  datasource:
    password: ${POSTGRES_PASSWORD:}
---
# Deployments run with SPRING_PROFILES_ACTIVE=prod: no default, so a missing POSTGRES_PASSWORD fails the start (ASVS 13.3.1).
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    password: ${POSTGRES_PASSWORD}
