spring:
  application:
    name: masroof-backend
  main:
    banner-mode: "off"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:masroof}
    username: ${POSTGRES_USER:masroof}
  flyway:
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
    baseline-on-migrate: false
---
# Local dev and tests only: an empty database password is tolerated when no deployment profile is active.
spring:
  config:
    activate:
      on-profile: "!prod"
  datasource:
    password: ${POSTGRES_PASSWORD:}
---
# Deployments run with SPRING_PROFILES_ACTIVE=prod: no default, so a missing POSTGRES_PASSWORD fails the start (ASVS 13.3.1).
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    password: ${POSTGRES_PASSWORD}
