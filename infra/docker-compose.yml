# Base stack. STORY-143: postgres + backend; STORY-142 adds minio, web, caddy and the restart policy.
# No host ports here; the dev-only overlay docker-compose.dev.yml publishes the backend on 127.0.0.1:8080.
name: masroof
services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-masroof}
      POSTGRES_USER: ${POSTGRES_USER:-masroof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
      start_interval: 1s
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}          # empty -> the image build fails naming GIT_SHA (never "unknown")
    image: masroof/backend:${IMAGE_TAG:-dev}
    environment:                       # explicit list; never env_file: .env (it would ship every secret and POSTGRES_HOST=localhost)
      SPRING_PROFILES_ACTIVE: prod     # containers always require a DB password (ProdDatabasePasswordGuard)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-masroof}
      POSTGRES_USER: ${POSTGRES_USER:-masroof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MASROOF_JWT_SECRET: ${MASROOF_JWT_SECRET:-}   # empty under profile prod -> the backend refuses to start (JwtConfiguration)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MASROOF_TRUSTED_PROXIES: ${CADDY_IP:-172.28.0.10}/32   # only Caddy (pinned address) may set X-Forwarded-For
      MASROOF_AUDIT_KEY: ${MASROOF_AUDIT_KEY:-}     # optional; empty -> derived from MASROOF_JWT_SECRET
      MASROOF_BOOTSTRAP_ADMIN_EMAIL: ${MASROOF_BOOTSTRAP_ADMIN_EMAIL:-}
      MASROOF_BOOTSTRAP_ADMIN_PASSWORD: ${MASROOF_BOOTSTRAP_ADMIN_PASSWORD:-}
      S3_ENDPOINT: http://minio:9000                # receipt attachments (STORY-168); no depends_on: without MinIO only attachments answer 503
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}             # same values MinIO uses as its root credentials
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-masroof-media}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped            # the app exits non-zero while Postgres is unreachable (Flyway at start); compose retries
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 60s
      start_interval: 2s
  minio:
    # MinIO no longer publishes images on Docker Hub/quay; Chainguard's source build is the pinned, non-root choice (DECISIONS.md).
    image: cgr.dev/chainguard/minio@sha256:73297936408b731668ca0e835ac9add1a35cb6026a125c2f0cd476d9ef48222c
    command: ["server", "/data", "--console-address", "127.0.0.1:9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}   # empty -> MinIO refuses to start (fail closed)
    volumes: [miniodata:/data]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r l <&3 && [[ $$l == *200* ]]"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 20s
      start_interval: 2s
  web:
    build:
      context: ../web
    image: masroof/web:${IMAGE_TAG:-dev}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s
  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    environment:
      DOMAIN: ${DOMAIN:-:80}           # empty -> ":80" = plain HTTP, no redirect (see Caddyfile)
    ports: ["80:80"]                   # the only published port; 443 for DOMAIN deploys is STORY-010
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks:
      default:
        ipv4_address: ${CADDY_IP:-172.28.0.10}   # pinned: the backend trusts X-Forwarded-For from exactly this address
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s
networks:
  default:
    ipam:
      config:
        - subnet: ${MASROOF_NET_SUBNET:-172.28.0.0/24}   # fixed so Caddy's address is known; tests pick a random one per project
          ip_range: ${MASROOF_NET_RANGE:-172.28.0.128/25}   # dynamic addresses come from the upper half, never colliding with Caddy's pinned .10
volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
