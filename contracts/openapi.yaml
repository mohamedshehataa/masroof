      parameters:
        - name: months
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 36
            default: 6
        - $ref: '#/components/parameters/IncludeCashWithdrawals'
      responses:
        '200':
          description: Per-period totals stacked by category, income and savings rate when available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trend'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/analytics/heatmap:
    get:
      tags: [Analytics]
      summary: Calendar heatmap and time patterns
      operationId: getAnalyticsHeatmap
      x-req: [REQ-AN-006, REQ-AN-007]
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/IncludeCashWithdrawals'
      responses:
        '200':
          description: Spend per day plus weekday x hour matrix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Heatmap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/analytics/budgets:
    get:
      tags: [Analytics]
      summary: Budget progress
      operationId: getAnalyticsBudgets
      x-req: [REQ-AN-008]
      parameters:
        - $ref: '#/components/parameters/Period'
      responses:
        '200':
          description: Progress per budget with threshold alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetStatusList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/analytics/forecast:
    get:
      tags: [Analytics]
      summary: Month-end forecast
      operationId: getAnalyticsForecast
      x-req: [REQ-AN-001]
      parameters:
        - $ref: '#/components/parameters/Period'
      responses:
        '200':
          description: Linear and weekday-aware projections plus upcoming recurring charges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forecast'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/analytics/insights:
    get:
      tags: [Analytics]
      summary: Anomalies and insights
      operationId: getAnalyticsInsights
      x-req: [REQ-AN-010, REQ-AN-011]
      parameters:
        - $ref: '#/components/parameters/Period'
      responses:
        '200':
          description: Anomalies, recurring changes, fee summary, item price history, data-quality stats and the latest AI narrative.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insights'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/analytics/settlement:
    get:
      tags: [Analytics]
      summary: Settlement between members
      operationId: getAnalyticsSettlement
      x-req: [REQ-AN-003]
      parameters:
        - $ref: '#/components/parameters/Period'
      responses:
        '200':
          description: Running balance for shared expenses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- Export / Import
  /api/export:
    get:
      tags: [Export]
      summary: Export the ledger
      operationId: exportLedger
      x-req: [REQ-EXP-007]
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, xlsx, pdf]
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: The file. `Content-Disposition` carries a filename.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                contentEncoding: binary
            application/pdf:
              schema:
                type: string
                contentEncoding: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/import:
    post:
      tags: [Import]
      summary: Import historical expenses
      description: Accepts the Masroof CSV format or a Google Sheets CSV export of the legacy tracker. Use `dryRun=true` to preview the mapping and row errors.
      operationId: importLedger
      x-req: [REQ-EXP-008]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportForm'
            encoding:
              file:
                contentType: text/csv
      responses:
        '200':
          description: Import result (or dry-run preview).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ---------------------------------------------------------------- Settings
  /api/settings:
    get:
      tags: [Settings]
      summary: Get household settings
      operationId: getSettings
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Settings]
      summary: Update household settings
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- Stream
  /api/stream:
    get:
      tags: [Stream]
      summary: Live event stream (SSE)
      description: |
        `text/event-stream`. Each event has `event: <StreamEvent.type>`, `id: <StreamEvent.id>` and a JSON `data:` line
        shaped like `StreamEvent`. Clients resume with `Last-Event-ID`. The server sends a `: ping` comment every 25 s.
      operationId: streamEvents
      x-req: [REQ-UI-001]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: An open SSE stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from `/auth/login` or `/auth/refresh`.
    deviceToken:
      type: http
      scheme: bearer
      description: Per-device, revocable token issued by `createDevice`. Only valid for `/api/ingest/*`.

  parameters:
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    FromDate:
      name: from
      in: query
      description: Inclusive start date (household timezone).
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      description: Inclusive end date (household timezone).
      schema:
        type: string
        format: date
    Period:
      name: period
      in: query
      description: |
        Analytics period. `current` (default) and `previous` follow the household `monthStartDay`;
        `YYYY-MM` selects the household month that starts in that calendar month; `YYYY-Www` selects an ISO week.
      schema:
        type: string
        pattern: '^(current|previous|\d{4}-\d{2}|\d{4}-W\d{2})$'
        default: current
    IncludeCashWithdrawals:
      name: includeCashWithdrawals
      in: query
      description: Count `CASH_WITHDRAWAL` entries as spending. Defaults to the household setting (off).
      schema:
        type: boolean
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated key; a repeated key within 24 h returns the original response.
      schema:
        type: string
        maxLength: 128

  responses:
    IngestAccepted:
      description: Raw message persisted; parsing continues asynchronously.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IngestAccepted'
    BadRequest:
      description: Malformed request or validation failure.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, expired or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed (wrong role or household).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found in this household.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict (duplicate, already merged, optimistic lock).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Body exceeds the configured size limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Semantically invalid (e.g. split shares do not sum to the total).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotImplemented:
      description: The operation is part of the contract but not built yet.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ---------------------------------------------------------------- Primitives
    Money:
      type: object
      description: |
        A monetary amount. `amountMinor` is an integer in the currency's minor unit (piastres, cents).
        Never a float. Negative values are only used for refund deltas in analytics.
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          format: int64
          description: Amount in minor units (EGP 12.50 = 1250).
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      examples:
        - amountMinor: 125000
          currency: EGP

    CurrencyCode:
      type: string
      description: ISO-4217 alphabetic code.
      pattern: '^[A-Z]{3}$'
      minLength: 3
      maxLength: 3
      examples: [EGP, USD]

    DecimalString:
      type: string
      description: Exact decimal encoded as a string (used for FX rates and quantities so no float is ever transmitted).
      pattern: '^-?\d+(\.\d{1,8})?$'
      examples: ['48.65', '1.5']

    NextCursor:
      type: [string, 'null']
      description: Cursor for the next page, or `null` when this is the last page.
      maxLength: 512

    Problem:
      type: object
      description: RFC 9457 problem details. Every 4xx/5xx body has this shape.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: >-
            Problem type URI. Clients switch on this, never on `title`. Stable values under
            `https://masroof.app/problems/`: `validation` (400/422), `unauthorized` (401), `not-found` (404),
            `conflict` (409), `rate-limited` (429), and for createExpense 409s `idempotency-in-progress`
            (retry later), `idempotency-key-reused` and `idempotency-expense-deleted` (permanent: use a new key).
            Framework-generated responses (404 for unknown routes, 415, 501, 503) use `about:blank`.
          examples:
            - https://masroof.app/problems/idempotency-in-progress
            - https://masroof.app/problems/idempotency-key-reused
            - https://masroof.app/problems/validation
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        traceId:
          type: string
          description: Correlation id to find the request in logs.
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
              rejectedValue:
                description: The offending value, redacted for sensitive fields.

    # ---------------------------------------------------------------- Enums
    TransactionType:
      type: string
      enum: [EXPENSE, INCOME, REFUND, TRANSFER, CASH_WITHDRAWAL]
    ExpenseStatus:
      type: string
      enum: [CONFIRMED, PENDING_REVIEW, POSSIBLE_DUPLICATE, IGNORED]
    PaymentMethod:
      type: string
      enum: [CASH, CARD, WALLET, INSTAPAY, BANK_TRANSFER, UNKNOWN]
    SplitMode:
      type: string
      enum: [NONE, EQUAL, CUSTOM]
    MessageSource:
      type: string
      enum: [WHATSAPP, SMS, PUSH, IOS_SHORTCUT, UPLOAD, MANUAL]
    ProcessingStatus:
      type: string
      enum: [RECEIVED, QUEUED, PARSED, MATCHED, DONE, IGNORED, FAILED]
    SourceRole:
      type: string
      enum: [PRIMARY, SUPPORTING]
    MemberRole:
      type: string
      enum: [ADMIN, MEMBER]
    DevicePlatform:
      type: string
      enum: [ANDROID, IOS_SHORTCUT, WEB]
    AccountType:
      type: string
      enum: [CARD, BANK, WALLET, CASH]
    BudgetPeriod:
      type: string
      enum: [MONTHLY, WEEKLY, CUSTOM]
    Cadence:
      type: string
      enum: [WEEKLY, BIWEEKLY, MONTHLY, QUARTERLY, YEARLY, CUSTOM]
    SmsTemplateStatus:
      type: string
      enum: [ACTIVE, PROPOSED, DISABLED]
    ReviewReason:
      type: string
      enum: [PENDING_REVIEW, LOW_CONFIDENCE, POSSIBLE_DUPLICATE, NEEDS_CLARIFICATION, RULE_FORCED]
    ClassifiedType:
      type: string
      description: Classifier output (§6 step 2). A superset of `TransactionType`.
      enum: [EXPENSE, INCOME, REFUND, TRANSFER, CASH_WITHDRAWAL, COMMAND, OTP, PROMO, CHITCHAT, UNKNOWN]
    CommandName:
      type: string
      enum: [TOTAL, CATEGORY_SPEND, UNDO, EDIT_LAST, BUDGET, PENDING, SUMMARY, HELP]
    Language:
      type: string
      enum: [ar, en, mixed]
    WhatsappMode:
      type: string
      enum: [GROUP, DIRECT]

    # ---------------------------------------------------------------- Health / App
    Health:
      type: object
      required: [status, version, gitSha, buildTime, time]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        version:
          type: string
          description: Semantic version of the backend build.
        gitSha:
          type: string
          pattern: '^[0-9a-f]{7,40}$'
        buildTime:
          type: string
          format: date-time
        time:
          type: string
          format: date-time
          description: Server time now (UTC).
        checks:
          type: object
          description: Component checks. Only `db` exists until later stories add keys (for example `storage`, `queue`).
          additionalProperties:
            type: string
            enum: [UP, DOWN]
      examples:
        - status: UP
          version: 0.1.0
          gitSha: 1a2b3c4
          buildTime: '2026-10-23T10:00:00Z'
          time: '2026-10-23T12:34:56Z'
          checks:
            db: UP

    AndroidRelease:
      type: object
      required: [versionCode, versionName, url, sha256, changelog]
      properties:
        versionCode:
          type: integer
          minimum: 1
        versionName:
          type: string
        url:
          type: string
          format: uri
          description: Signed release APK download URL.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        changelog:
          type: string
        minSupportedVersionCode:
          type: integer
          description: Builds older than this must update before ingesting.

    # ---------------------------------------------------------------- Auth
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
        deviceName:
          type: string
          maxLength: 80
          description: Label for the session shown in Settings > Sessions.

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType, member]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access-token lifetime in seconds.
        tokenType:
          type: string
          enum: [Bearer]
        member:
          $ref: '#/components/schemas/Member'

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
        allSessions:
          type: boolean
          default: false

    InviteRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
        phoneE164:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
          description: The member's WhatsApp number, so their messages map to them.
        role:
          $ref: '#/components/schemas/MemberRole'

    Invite:
      type: object
      required: [id, code, expiresAt, displayName]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Single-use invite code; share out of band.
        displayName:
          type: string
        expiresAt:
          type: string
          format: date-time

    InviteAcceptRequest:
      type: object
      required: [code, email, password]
      properties:
        code:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 256

    Member:
      type: object
      required: [id, householdId, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        displayName:
          type: string
        phoneE164:
          type: [string, 'null']
          pattern: '^\+[1-9]\d{6,14}$'
        whatsappId:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/MemberRole'
        color:
          type: [string, 'null']
          pattern: '^#[0-9A-Fa-f]{6}$'
        avatarUrl:
          type: [string, 'null']
          format: uri

    # ---------------------------------------------------------------- Expenses
    Expense:
      type: object
      description: One ledger entry. Mirrors the `expense` table (§8) plus its child rows.
      required:
        - id
        - householdId
        - type
        - amount
        - occurredAt
        - status
        - confidence
        - paymentMethod
        - tags
        - isRecurring
        - splitMode
        - items
        - sources
        - splits
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          $ref: '#/components/schemas/Money'
          description: Amount in the household base currency (`amount_egp`).
        amountOriginal:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Original amount when the transaction was in a foreign currency.
        fxRate:
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
          description: Rate used to convert `amountOriginal` to `amount` (base per 1 original unit).
        occurredAt:
          type: string
          format: date-time
        merchantId:
          type: [string, 'null']
          format: uuid
        merchantRaw:
          type: [string, 'null']
          maxLength: 200
        merchantName:
          type: [string, 'null']
          description: Denormalised normalised merchant name for display.
        categoryId:
          type: [string, 'null']
          format: uuid
        paidByMemberId:
          type: [string, 'null']
          format: uuid
        paymentAccountId:
          type: [string, 'null']
          format: uuid
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/ExpenseStatus'
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Parser confidence (not money; a probability).
        notes:
          type: [string, 'null']
          maxLength: 500
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 30
        isRecurring:
          type: boolean
        recurringSeriesId:
          type: [string, 'null']
          format: uuid
        splitMode:
          $ref: '#/components/schemas/SplitMode'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseItem'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseSource'
        splits:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseSplit'
        duplicateOfExpenseId:
          type: [string, 'null']
          format: uuid
          description: Set when `status` is `POSSIBLE_DUPLICATE`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: [string, 'null']
          format: date-time

    ExpenseItem:
      type: object
      description: A receipt line item.
      required: [name, total]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        qty:
          $ref: '#/components/schemas/DecimalString'
          description: Quantity; may be fractional (e.g. `1.5` kg).
        unitPrice:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        categoryId:
          type: [string, 'null']
          format: uuid

    ExpenseSource:
      type: object
      description: Link between an expense and a raw message that evidences it.
      required: [rawMessageId, role, rawMessage]
      properties:
        rawMessageId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/SourceRole'
        rawMessage:
          $ref: '#/components/schemas/RawMessageSummary'

    ExpenseSplit:
      type: object
      required: [memberId, shareAmount]
      properties:
        memberId:
          type: string
          format: uuid
        shareAmount:
          $ref: '#/components/schemas/Money'

    RawMessageSummary:
      type: object
      description: Redacted view of a `raw_message` (no full payload, sender masked).
      required: [id, source, receivedAt, processingStatus]
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/MessageSource'
        externalId:
          type: [string, 'null']
          description: SMS id, WhatsApp message id or notification key.
        senderMasked:
          type: [string, 'null']
          description: Bank sender id, or a phone number with all but the last 2 digits masked.
        memberId:
          type: [string, 'null']
          format: uuid
        textPreview:
          type: [string, 'null']
          maxLength: 160
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
        receivedAt:
          type: string
          format: date-time
        processingStatus:
          $ref: '#/components/schemas/ProcessingStatus'
        error:
          type: [string, 'null']

    ExpenseCreate:
      type: object
      required: [type, amount, occurredAt]
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          $ref: '#/components/schemas/Money'
        amountOriginal:
          $ref: '#/components/schemas/Money'
        occurredAt:
          type: string
          format: date-time
        merchantId:
          type: string
          format: uuid
        merchantRaw:
          type: string
          maxLength: 200
        categoryId:
          type: string
          format: uuid
        paidByMemberId:
          type: string
          format: uuid
        paymentAccountId:
          type: string
          format: uuid
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        notes:
          type: string
          maxLength: 500
          description: Free text, at most 500 characters (Unicode code points); must not contain NUL.
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 30
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseItem'
        splitMode:
          $ref: '#/components/schemas/SplitMode'
        splits:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseSplit'

    ExpensePatch:
      type: object
      description: All fields optional; `null` clears a nullable field.
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          $ref: '#/components/schemas/Money'
        occurredAt:
          type: string
          format: date-time
        merchantId:
          type: [string, 'null']
          format: uuid
        merchantRaw:
          type: [string, 'null']
          maxLength: 200
        categoryId:
          type: [string, 'null']
          format: uuid
        paidByMemberId:
          type: [string, 'null']
          format: uuid
        paymentAccountId:
          type: [string, 'null']
          format: uuid
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/ExpenseStatus'
        notes:
          type: [string, 'null']
          maxLength: 500
          description: Free text, at most 500 characters (Unicode code points); must not contain NUL.
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 30
        isRecurring:
          type: boolean
        recurringSeriesId:
          type: [string, 'null']
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseItem'
        version:
          type: integer
          description: Optimistic-lock version; `409` when stale.

    ExpensePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Expense'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        totalAmount:
          $ref: '#/components/schemas/Money'
          description: Sum of the whole filtered set (not only this page), excluding TRANSFER.

    MergeRequest:
      type: object
      required: [sourceExpenseIds]
      properties:
        sourceExpenseIds:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: uuid

    SplitRequest:
      type: object
      required: [splitMode]
      properties:
        splitMode:
          $ref: '#/components/schemas/SplitMode'
        splits:
          type: array
          description: Required for `CUSTOM`; ignored for `EQUAL` (computed, remainder goes to the payer) and `NONE`.
          items:
            $ref: '#/components/schemas/ExpenseSplit'

    # ---------------------------------------------------------------- Review
    ReviewItem:
      type: object
      required: [expense, reason]
      properties:
        expense:
          $ref: '#/components/schemas/Expense'
        reason:
          $ref: '#/components/schemas/ReviewReason'
        clarificationQuestion:
          type: [string, 'null']
          description: The one question the parser wants answered (e.g. "Groceries or Household?").
        candidateDuplicate:
          oneOf:
            - $ref: '#/components/schemas/Expense'
            - type: 'null'
        matchScore:
          type: [number, 'null']
          minimum: 0
          maximum: 1

    ReviewPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewItem'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'

    ResolveRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [CONFIRM, EDIT_AND_CONFIRM, MERGE, KEEP_BOTH, IGNORE]
        patch:
          $ref: '#/components/schemas/ExpensePatch'
          description: Applied before confirming when `action` is `EDIT_AND_CONFIRM`.
        mergeIntoExpenseId:
          type: string
          format: uuid
          description: Target for `MERGE`; defaults to `candidateDuplicate`.

    # ---------------------------------------------------------------- Ingest
    IngestSmsRequest:
      type: object
      required: [sender, body, receivedAt, deviceId, smsId]
      properties:
        sender:
          type: string
          maxLength: 40
          description: Sender id as shown on the phone (e.g. `CIB`, `InstaPay`).
        body:
          type: string
          maxLength: 2000
        receivedAt:
          type: string
          format: date-time
        deviceId:
          type: string
          format: uuid
        smsId:
          type: string
          maxLength: 64
          description: Stable id on the device; idempotency key together with `deviceId`.

    IngestParsedTransactionRequest:
      type: object
      additionalProperties: false
      description: |
        A transaction parsed on the phone. There is deliberately no field for message text: the only
        free text is `merchant`, a label with every digit removed.
      required: [deviceId, localId, source, kind, amountMinor, currency, occurredAt, senderId]
      properties:
        deviceId:
          type: string
          format: uuid
        localId:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: HMAC-SHA256 (hex) of sender, received time and message text, keyed with a random per-installation secret that never leaves the phone (Android Keystore). Idempotency key with `deviceId`; reveals nothing about the text and cannot be brute-forced from it.
        source:
          type: string
          enum: [SMS, NOTIFICATION]
        kind:
          type: string
          enum: [PURCHASE, TRANSFER_OUT, TRANSFER_IN, INCOME, REFUND, CASH_WITHDRAWAL, FEE]
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000000000
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        occurredAt:
          type: string
          format: date-time
        instrumentLast4:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
          description: Card or account last four, only when the message named it explicitly.
        senderId:
          type: string
          pattern: '^[A-Za-z][A-Za-z._&-]{0,19}$'
          description: Allowlisted sender id (SMS) or Android package name (notification, truncated to its institution token).
        institution:
          type: [string, 'null']
          maxLength: 40
          pattern: '^[^0-9]*$'
        paymentMethod:
          type: [string, 'null']
          enum: [CARD, WALLET, INSTAPAY, BANK_TRANSFER, UNKNOWN, null]
        merchant:
          type: [string, 'null']
          maxLength: 40
          pattern: '^[^0-9]*$'
          description: Merchant or counterparty label. Every digit removed on the device; the server rejects a label with a digit.

    IngestNotificationRequest:
      type: object
      required: [packageName, text, postedAt, deviceId, notificationKey]
      properties:
        packageName:
          type: string
          maxLength: 200
        title:
          type: string
          maxLength: 200
        text:
          type: string
          maxLength: 4000
        postedAt:
          type: string
          format: date-time
        deviceId:
          type: string
          format: uuid
        notificationKey:
          type: string
          maxLength: 128

    IngestReceiptForm:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentEncoding: binary
          description: Image or PDF, at most 15 MB.
        note:
          type: string
          maxLength: 500
          description: Optional caption typed by the user (e.g. "split with Mai").
        occurredAt:
          type: string
          format: date-time
        memberId:
          type: string
          format: uuid
          description: Payer; defaults to the device owner.
        clientId:
          type: string
          maxLength: 64
          description: Client-generated idempotency id for offline outbox retries.

    IngestTextRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
        memberId:
          type: string
          format: uuid
        receivedAt:
          type: string
          format: date-time
        clientId:
          type: string
          maxLength: 64

    IngestAccepted:
      type: object
      required: [rawMessageId, outcome]
      properties:
        rawMessageId:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [ACCEPTED, DUPLICATE, REJECTED_OTP, REJECTED_UNKNOWN_SENDER]
          description: "`DUPLICATE` means the same external id or image hash was already ingested; the original id is returned."
        expenseId:
          type: string
          format: uuid
          description: |
            Only for `POST /api/ingest/parsed-transactions` with outcome `ACCEPTED`: the expense that was just created, so the
            app can offer an Undo (`DELETE /api/expenses/{expenseId}`). Absent for a duplicate and for the raw-text endpoints.

    # ---------------------------------------------------------------- Parsing
    ParseRequest:
      type: object
      required: [text, source]
      properties:
        text:
          type: string
          maxLength: 20000
        source:
          $ref: '#/components/schemas/MessageSource'
        sender:
          type: string
          maxLength: 40
        receivedAt:
          type: string
          format: date-time
        memberId:
          type: string
          format: uuid
        history:
          type: array
          description: Recent prior messages of the same sender, for corrections ("no it was 250").
          maxItems: 5
          items:
            type: object
            required: [text]
            properties:
              text:
                type: string
              botReply:
                type: string

    ParseResult:
      type: object
      description: The LLM/rules extraction contract (§6 step 3) after normalisation and server-side bounding (S10.5).
      required: [type, confidence, language, needsClarification, shouldIngest, injectionObeyed]
      properties:
        type:
          $ref: '#/components/schemas/ClassifiedType'
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        originalAmount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        merchantRaw:
          type: [string, 'null']
        merchantNormalized:
          type: [string, 'null']
        categorySuggestion:
          type: [string, 'null']
          description: One of the household category names (English key), or `null`.
        subcategory:
          type: [string, 'null']
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseItem'
        date:
          type: [string, 'null']
          format: date
        time:
          type: [string, 'null']
          pattern: '^\d{2}:\d{2}$'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        accountLast4:
          type: [string, 'null']
          pattern: '^\d{4}$'
        paidByHint:
          type: [string, 'null']
        splitHint:
          type: [string, 'null']
        notes:
          type: [string, 'null']
        confidence:
          type: number
          minimum: 0
          maximum: 1
        language:
          $ref: '#/components/schemas/Language'
        needsClarification:
          type: boolean
        clarificationQuestion:
          type: [string, 'null']
        isCommand:
          type: boolean
        command:
          oneOf:
            - $ref: '#/components/schemas/CommandName'
            - type: 'null'
        commandArgs:
          type: object
          additionalProperties: true
        shouldIngest:
          type: boolean
          description: False for OTP, PROMO, CHITCHAT, COMMAND and rejected injections.
        injectionObeyed:
          type: boolean
          description: Always `false` in production; the eval harness asserts it.
        model:
          type: [string, 'null']
          description: Model id used, or `null` when rules alone parsed the input.
        costMicros:
          type: [integer, 'null']
          format: int64
          description: LLM cost in micro-USD (integer; never a float).
        latencyMs:
          type: [integer, 'null']

    # ---------------------------------------------------------------- WhatsApp webhook
    WhatsappWebhookPayload:
      type: object
      description: Meta Cloud API webhook envelope; persisted verbatim in `raw_message.payload`.
      required: [object, entry]
      properties:
        object:
          type: string
          enum: [whatsapp_business_account]
        entry:
          type: array
          items:
            type: object
            additionalProperties: true

    # ---------------------------------------------------------------- Categories
    Category:
      type: object
      required: [id, householdId, nameEn, nameAr, isEssential, sortOrder, archived]
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        nameEn:
          type: string
          maxLength: 60
        nameAr:
          type: string
          maxLength: 60
        icon:
          type: [string, 'null']
          maxLength: 40
        color:
          type: [string, 'null']
          pattern: '^#[0-9A-Fa-f]{6}$'
        parentId:
          type: [string, 'null']
          format: uuid
        isEssential:
          type: boolean
        sortOrder:
          type: integer
        archived:
          type: boolean
      examples:
        - id: 7a1a4a7e-5d3e-4a0e-9d0a-1b2c3d4e5f60
          householdId: 0f0f0f0f-0f0f-4f0f-8f0f-0f0f0f0f0f0f
          nameEn: Fuel
          nameAr: بنزين
          icon: fuel
          color: '#F59E0B'
          parentId: null
          isEssential: true
          sortOrder: 3
          archived: false

    CategoryInput:
      type: object
      properties:
        nameEn:
          type: string
          maxLength: 60
        nameAr:
          type: string
          maxLength: 60
        icon:
          type: [string, 'null']
          maxLength: 40
        color:
          type: [string, 'null']
          pattern: '^#[0-9A-Fa-f]{6}$'
        parentId:
          type: [string, 'null']
          format: uuid
        isEssential:
          type: boolean
        sortOrder:
          type: integer
        archived:
          type: boolean

    # ---------------------------------------------------------------- Accounts
    PaymentAccount:
      type: object
      required: [id, memberId, type, currency, isShared]
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AccountType'
        institution:
          type: [string, 'null']
          maxLength: 80
        last4:
          type: [string, 'null']
          pattern: '^\d{4}$'
        nickname:
          type: [string, 'null']
          maxLength: 60
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        isShared:
          type: boolean

    PaymentAccountInput:
      type: object
      properties:
        memberId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AccountType'
        institution:
          type: [string, 'null']
          maxLength: 80
        last4:
          type: [string, 'null']
          pattern: '^\d{4}$'
        nickname:
          type: [string, 'null']
          maxLength: 60
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        isShared:
          type: boolean

    # ---------------------------------------------------------------- Merchants
    Merchant:
      type: object
      required: [id, normalizedName, aliases]
      properties:
        id:
          type: string
          format: uuid
        normalizedName:
          type: string
          maxLength: 120
        aliases:
          type: array
          items:
            type: string
            maxLength: 120
        defaultCategoryId:
          type: [string, 'null']
          format: uuid
        logoUrl:
          type: [string, 'null']
          format: uri

    MerchantInput:
      type: object
      properties:
        normalizedName:
          type: string
          maxLength: 120
        aliases:
          type: array
          items:
            type: string
            maxLength: 120
        defaultCategoryId:
          type: [string, 'null']
          format: uuid
        logoUrl:
          type: [string, 'null']
          format: uri

    MerchantRule:
      type: object
      required: [id, pattern, categoryId, tags, priority, learnedFromCorrection]
      properties:
        id:
          type: string
          format: uuid
        pattern:
          type: string
          maxLength: 200
          description: Case-insensitive match against the normalised merchant; `*` wildcard allowed.
        categoryId:
          type: string
          format: uuid
        memberId:
          type: [string, 'null']
          format: uuid
        tags:
          type: array
          items:
            type: string
            maxLength: 40
        priority:
          type: integer
        learnedFromCorrection:
          type: boolean

    MerchantRuleInput:
      type: object
      properties:
        pattern:
          type: string
          maxLength: 200
        categoryId:
          type: string
          format: uuid
        memberId:
          type: [string, 'null']
          format: uuid
        tags:
          type: array
          items:
            type: string
            maxLength: 40
        priority:
          type: integer

    # ---------------------------------------------------------------- Budgets
    Budget:
      type: object
      required: [id, householdId, categoryId, period, amount, rollover, alertThresholds]
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        categoryId:
          type: [string, 'null']
          format: uuid
          description: "`null` means the total household budget."
        period:
          $ref: '#/components/schemas/BudgetPeriod'
        amount:
          $ref: '#/components/schemas/Money'
        rollover:
          type: boolean
        alertThresholds:
          type: array
          description: Percentages at which alerts fire.
          items:
            type: integer
            minimum: 1
            maximum: 200
          default: [50, 80, 100]

    BudgetInput:
      type: object
      properties:
        categoryId:
          type: [string, 'null']
          format: uuid
        period:
          $ref: '#/components/schemas/BudgetPeriod'
        amount:
          $ref: '#/components/schemas/Money'
        rollover:
          type: boolean
        alertThresholds:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 200

    # ---------------------------------------------------------------- Recurring
    RecurringSeries:
      type: object
      required: [id, cadence, expectedAmount, nextExpectedDate, active]
      properties:
        id:
          type: string
          format: uuid
        merchantId:
          type: [string, 'null']
          format: uuid
        categoryId:
          type: [string, 'null']
          format: uuid
        label:
          type: [string, 'null']
          maxLength: 120
        cadence:
          $ref: '#/components/schemas/Cadence'
        expectedAmount:
          $ref: '#/components/schemas/Money'
        nextExpectedDate:
          type: string
          format: date
        lastSeenAt:
          type: [string, 'null']
          format: date-time
        active:
          type: boolean
        autoDetected:
          type: boolean
          default: false

    RecurringSeriesInput:
      type: object
      properties:
        merchantId:
          type: [string, 'null']
          format: uuid
        categoryId:
          type: [string, 'null']
          format: uuid
        label:
          type: [string, 'null']
          maxLength: 120
        cadence:
          $ref: '#/components/schemas/Cadence'
        expectedAmount:
          $ref: '#/components/schemas/Money'
        nextExpectedDate:
          type: string
          format: date
        active:
          type: boolean

    # ---------------------------------------------------------------- SMS templates
    SmsTemplate:
      type: object
      required: [id, senderPattern, regex, fieldMapping, status, hitCount]
      properties:
        id:
          type: string
          format: uuid
        senderPattern:
          type: string
          maxLength: 80
        regex:
          type: string
          maxLength: 2000
          description: Java regex with named groups.
        fieldMapping:
          type: object
          description: Named group -> extracted field (`amount`, `currency`, `merchant`, `last4`, `date`, `time`, `balance`, `reference`, `direction`).
          additionalProperties:
            type: string
        status:
          $ref: '#/components/schemas/SmsTemplateStatus'
        hitCount:
          type: integer
          minimum: 0
        exampleRedacted:
          type: [string, 'null']
          description: An anonymised sample the template matched (never a raw SMS).

    SmsTemplateInput:
      type: object
      properties:
        senderPattern:
          type: string
          maxLength: 80
        regex:
          type: string
          maxLength: 2000
        fieldMapping:
          type: object
          additionalProperties:
            type: string
        status:
          $ref: '#/components/schemas/SmsTemplateStatus'

    # ---------------------------------------------------------------- Devices
    Device:
      type: object
      required: [id, memberId, platform, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        name:
          type: string
          maxLength: 80
        lastSeenAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    DeviceInput:
      type: object
      properties:
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        name:
          type: string
          maxLength: 80

    DeviceCreated:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Plaintext device token, shown once.

    # ---------------------------------------------------------------- Analytics
    PeriodRange:
      type: object
      required: [label, from, to]
      properties:
        label:
          type: string
          description: Resolved period id, e.g. `2026-10`.
        from:
          type: string
          format: date
        to:
          type: string
          format: date

    AnalyticsSummary:
      type: object
      required: [period, total, previousTotal, deltaPercentBps, dailyAverage, projectedTotal, daysLeft, pendingReviewCount]
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        total:
          $ref: '#/components/schemas/Money'
        previousTotal:
          $ref: '#/components/schemas/Money'
        deltaPercentBps:
          type: [integer, 'null']
          description: Change vs previous period in basis points (1250 = +12.50%); `null` when previous is zero.
        dailyAverage:
          $ref: '#/components/schemas/Money'
        projectedTotal:
          $ref: '#/components/schemas/Money'
          description: Linear projection to period end.
        projectedTotalWeekdayAware:
          $ref: '#/components/schemas/Money'
        remainingBudget:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        daysLeft:
          type: integer
          minimum: 0
        income:
          $ref: '#/components/schemas/Money'
        topCategories:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/CategoryTotal'
        pendingReviewCount:
          type: integer
          minimum: 0

    CategoryTotal:
      type: object
      required: [categoryId, nameEn, nameAr, total, shareBps, count]
      properties:
        categoryId:
          type: [string, 'null']
          format: uuid
          description: "`null` for uncategorised."
        nameEn:
          type: string
        nameAr:
          type: string
        color:
          type: [string, 'null']
        total:
          $ref: '#/components/schemas/Money'
        previousTotal:
          $ref: '#/components/schemas/Money'
        shareBps:
          type: integer
          description: Share of the period total in basis points.
        count:
          type: integer
        deltaPercentBps:
          type: [integer, 'null']

    CategoryBreakdown:
      type: object
      required: [period, total, items]
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        total:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTotal'

    MemberTotal:
      type: object
      required: [memberId, displayName, paid, shareOfTotalBps, count]
      properties:
        memberId:
          type: string
          format: uuid
        displayName:
          type: string
        color:
          type: [string, 'null']
        paid:
          $ref: '#/components/schemas/Money'
        owedShare:
          $ref: '#/components/schemas/Money'
          description: What this member should bear after splits.
        shareOfTotalBps:
          type: integer
        count:
          type: integer

    MemberBreakdown:
      type: object
      required: [period, total, items]
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        total:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberTotal'

    MerchantTotal:
      type: object
      required: [merchantId, name, total, visits, averageTicket]
      properties:
        merchantId:
          type: [string, 'null']
          format: uuid
        name:
          type: string
        total:
          $ref: '#/components/schemas/Money'
        visits:
          type: integer
        averageTicket:
          $ref: '#/components/schemas/Money'
        categoryId:
          type: [string, 'null']
          format: uuid

    MerchantBreakdown:
      type: object
      required: [period, items]
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        items:
          type: array
          items:
            $ref: '#/components/schemas/MerchantTotal'

    TrendPoint:
      type: object
      required: [period, total, byCategory]
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        total:
          $ref: '#/components/schemas/Money'
        income:
          $ref: '#/components/schemas/Money'
        savingsRateBps:
          type: [integer, 'null']
          description: "`(income - total) / income` in basis points; `null` without income."
        byCategory:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTotal'

    Trend:
      type: object
      required: [points]
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'

    Heatmap:
      type: object
      required: [period, days, weekdayHour]
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        days:
          type: array
          items:
            type: object
            required: [date, total, count]
            properties:
              date:
                type: string
                format: date
              total:
                $ref: '#/components/schemas/Money'
              count:
                type: integer
        weekdayHour:
          type: array
          description: 7 x 24 matrix of totals; index 0 is Saturday (Egyptian week start), hours in Cairo time.
          minItems: 7
          maxItems: 7
          items:
            type: array
            minItems: 24
            maxItems: 24
            items:
              $ref: '#/components/schemas/Money'

    BudgetStatus:
      type: object
      required: [budget, spent, remaining, progressBps, alertsFired, onTrack]
      properties:
        budget:
          $ref: '#/components/schemas/Budget'
        spent:
          $ref: '#/components/schemas/Money'
        remaining:
          $ref: '#/components/schemas/Money'
        rolledOver:
          $ref: '#/components/schemas/Money'
        progressBps:
          type: integer
          description: Spent / budget in basis points (may exceed 10000).
        alertsFired:
          type: array
          items:
            type: integer
        onTrack:
          type: boolean

    BudgetStatusList:
      type: object
      required: [period, items]
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        items:
          type: array
          items:
            $ref: '#/components/schemas/BudgetStatus'

    Forecast:
      type: object
      required: [period, spentSoFar, linear, weekdayAware, upcomingRecurring]
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        spentSoFar:
          $ref: '#/components/schemas/Money'
        linear:
          $ref: '#/components/schemas/Money'
        weekdayAware:
          $ref: '#/components/schemas/Money'
        upcomingRecurring:
          type: array
          items:
            type: object
            required: [series, expectedDate, expectedAmount]
            properties:
              series:
                $ref: '#/components/schemas/RecurringSeries'
              expectedDate:
                type: string
                format: date
              expectedAmount:
                $ref: '#/components/schemas/Money'

    Insight:
      type: object
      required: [kind, severity, titleEn, titleAr]
      properties:
        kind:
          type: string
          enum: [LARGE_TRANSACTION, NEW_MERCHANT_LARGE, DUPLICATE_LOOKING, FEES_SUMMARY, RECURRING_AMOUNT_CHANGED, RECURRING_MISSED, PRICE_HISTORY, CATEGORY_SPIKE]
        severity:
          type: string
          enum: [INFO, WARN]
        titleEn:
          type: string
        titleAr:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        expenseIds:
          type: array
          items:
            type: string
            format: uuid
        details:
          type: object
          additionalProperties: true

    Insights:
      type: object
      required: [period, insights, paymentMethodMix, dataQuality]
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        insights:
          type: array
          items:
            $ref: '#/components/schemas/Insight'
        paymentMethodMix:
          type: array
          items:
            type: object
            required: [paymentMethod, total, shareBps]
            properties:
              paymentMethod:
                $ref: '#/components/schemas/PaymentMethod'
              total:
                $ref: '#/components/schemas/Money'
              shareBps:
                type: integer
        dataQuality:
          type: object
          required: [autoCapturedBps, pendingReviewCount, correctionRateBps]
          properties:
            autoCapturedBps:
              type: integer
              description: Share of entries that arrived from SMS/push/WhatsApp rather than manual, in basis points.
            pendingReviewCount:
              type: integer
            correctionRateBps:
              type: integer
              description: Corrections / total parsed entries, in basis points.
            aiCostMicrosThisPeriod:
              type: integer
              format: int64
        narrative:
          type: [object, 'null']
          description: Latest AI monthly/weekly report.
          required: [generatedAt, textEn, textAr]
          properties:
            generatedAt:
              type: string
              format: date-time
            textEn:
              type: string
            textAr:
              type: string

    Settlement:
      type: object
      required: [period, balances, transfers]
      properties:
        period:
          $ref: '#/components/schemas/PeriodRange'
        balances:
          type: array
          description: Positive `net` means the member is owed money.
          items:
            type: object
            required: [memberId, displayName, paid, owedShare, net]
            properties:
              memberId:
                type: string
                format: uuid
              displayName:
                type: string
              paid:
                $ref: '#/components/schemas/Money'
              owedShare:
                $ref: '#/components/schemas/Money'
              net:
                $ref: '#/components/schemas/Money'
        transfers:
          type: array
          description: Minimal set of transfers that settles all balances.
          items:
            type: object
            required: [fromMemberId, toMemberId, amount]
            properties:
              fromMemberId:
                type: string
                format: uuid
              toMemberId:
                type: string
                format: uuid
              amount:
                $ref: '#/components/schemas/Money'

    # ---------------------------------------------------------------- Import
    ImportForm:
      type: object
      required: [file, format]
      properties:
        file:
          type: string
          contentEncoding: binary
        format:
          type: string
          enum: [MASROOF_CSV, GOOGLE_SHEETS_LEGACY]
        dryRun:
          type: boolean
          default: false
        defaultMemberId:
          type: string
          format: uuid

    ImportResult:
      type: object
      required: [dryRun, totalRows, imported, skippedDuplicates, errors]
      properties:
        dryRun:
          type: boolean
        totalRows:
          type: integer
        imported:
          type: integer
        skippedDuplicates:
          type: integer
        errors:
          type: array
          items:
            type: object
            required: [row, message]
            properties:
              row:
                type: integer
              message:
                type: string
        preview:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ExpenseCreate'

    # ---------------------------------------------------------------- Settings
    Settings:
      type: object
      required:
        - householdId
        - householdName
        - baseCurrency
        - timezone
        - monthStartDay
        - whatsappMode
        - countAtmWithdrawalsAsSpending
        - autoConfirmThreshold
        - weeklySummaryDay
        - members
      properties:
        householdId:
          type: string
          format: uuid
        householdName:
          type: string
          maxLength: 80
        baseCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        timezone:
          type: string
          description: IANA zone id.
          default: Africa/Cairo
        monthStartDay:
          type: integer
          minimum: 1
          maximum: 28
          default: 1
        whatsappMode:
          $ref: '#/components/schemas/WhatsappMode'
        countAtmWithdrawalsAsSpending:
          type: boolean
          default: false
        autoConfirmThreshold:
          type: number
          minimum: 0.5
          maximum: 1
          default: 0.85
          description: Parser confidence at or above which entries are auto-CONFIRMED (tuned by the eval calibration gate).
        weeklySummaryDay:
          type: string
          enum: [SAT, SUN, MON, TUE, WED, THU, FRI, OFF]
          default: FRI
        aiModels:
          type: object
          description: Configured model ids (read-only here; changed via config + `/eval`).
          properties:
            fast:
              type: string
            vision:
              type: string
        aiCostThisMonthMicros:
          type: integer
          format: int64
          description: LLM spend this period in micro-USD.
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    SettingsPatch:
      type: object
      properties:
        householdName:
          type: string
          maxLength: 80
        monthStartDay:
          type: integer
          minimum: 1
          maximum: 28
        whatsappMode:
          $ref: '#/components/schemas/WhatsappMode'
        countAtmWithdrawalsAsSpending:
          type: boolean
        autoConfirmThreshold:
          type: number
          minimum: 0.5
          maximum: 1
        weeklySummaryDay:
          type: string
          enum: [SAT, SUN, MON, TUE, WED, THU, FRI, OFF]

    # ---------------------------------------------------------------- Stream
    StreamEvent:
      type: object
      required: [id, type, at]
      properties:
        id:
          type: string
          description: Monotonic event id (also sent as the SSE `id:` field).
        type:
          type: string
          enum: [EXPENSE_CREATED, EXPENSE_UPDATED, EXPENSE_DELETED, REVIEW_ITEM_ADDED, REVIEW_ITEM_RESOLVED, BUDGET_ALERT, SETTINGS_CHANGED]
        at:
          type: string
          format: date-time
        expenseId:
          type: [string, 'null']
          format: uuid
        payload:
          type: object
          additionalProperties: true
