openapi: 3.1.0
info:
  title: Masroof API
  version: 0.1.0
  summary: Household expense tracker for Egypt (WhatsApp, SMS, receipts, analytics).
  description: |
    **Contract-first.** This file is the single source of truth for the Masroof backend API.
    Spring server interfaces, the TypeScript (PWA) client and the Kotlin (Android) client are
    generated from it; generated code is never hand-edited. Breaking changes are gated by
    `scripts/quality/oasdiff.sh` and require an ADR (see `docs/adr/0001-contract-first-openapi.md`).

    ## Conventions
    - JSON bodies use `camelCase`.
    - **Money is never a float.** Every monetary value is a `Money` object: integer minor units
      (piastres for EGP, cents for USD) plus an ISO-4217 currency code.
    - All timestamps are RFC 3339 `date-time` in UTC; calendar dates are `YYYY-MM-DD` interpreted in
      the household timezone (`Africa/Cairo` by default).
    - Every 4xx/5xx response is an RFC 9457 `application/problem+json` document (`Problem`).
    - Collections are paginated with an opaque cursor: `{ items, nextCursor }`.
    - IDs are UUIDs. Everything is scoped to the caller's household.
    - `x-req` on an operation lists the requirement IDs (S11) it realises.
  contact:
    name: Masroof maintainers
    url: https://github.com/masroof/masroof
  license:
    name: Proprietary
    identifier: LicenseRef-Masroof-Proprietary

servers:
  - url: http://localhost
    description: Local stack (`make up`, via Caddy on port 80).
  - url: https://{domain}
    description: Self-hosted production behind Caddy (HTTPS is required for WhatsApp webhooks).
    variables:
      domain:
        default: masroof.invalid
        description: The public hostname configured in `infra/.env`.

tags:
  - name: Health
    description: Liveness, readiness and build information (used by the walking skeleton).
  - name: App
    description: Sideloaded Android app distribution metadata.
  - name: Auth
    description: Email + password login, rotating refresh tokens, household invites.
  - name: Expenses
    description: The expense ledger (expenses, income, refunds, transfers, cash withdrawals).
  - name: Review
    description: Review inbox for pending, low-confidence and possible-duplicate entries.
  - name: Ingest
    description: Device ingestion endpoints (SMS, push notifications, receipts, free text). Authenticated with a per-device token.
  - name: Parsing
    description: Side-effect-free parsing endpoints used by the eval harness and the "preview" UI.
  - name: Webhooks
    description: Inbound webhooks from the WhatsApp Business Cloud API.
  - name: Categories
    description: Bilingual expense categories (tree).
  - name: Accounts
    description: Payment accounts (cards, bank accounts, wallets, cash) and their owner.
  - name: Merchants
    description: Normalised merchants and aliases.
  - name: Merchant rules
    description: Learned and manual merchant -> category/member rules applied before the LLM.
  - name: Budgets
    description: Per-category or total budgets with alert thresholds.
  - name: Recurring
    description: Auto-detected and manual recurring series / subscriptions.
  - name: SMS templates
    description: Per-sender regex templates for the deterministic SMS parser.
  - name: Devices
    description: Registered ingestion devices and their revocable tokens.
  - name: Analytics
    description: Server-computed analytics; clients only render.
  - name: Export
    description: Export the ledger to CSV, XLSX or PDF.
  - name: Import
    description: Import historical data (CSV, Google Sheets export).
  - name: Settings
    description: Household settings.
  - name: Stream
    description: Server-Sent Events so open apps update live.

security:
  - bearerJwt: []

paths:
  # ---------------------------------------------------------------- Health / App
  /health:
    get:
      tags: [Health]
      summary: Health and build information
      description: Returns `UP` when the service and its database are reachable. No authentication.
      operationId: getHealth
      security: []
      x-req: [REQ-OPS-020]
      responses:
        '200':
          description: Service and database are up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Service is not ready.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/app/android/latest:
    get:
      tags: [App]
      summary: Latest sideloadable Android build
      description: Metadata for the newest signed release APK so the app can self-update.
      operationId: getAndroidLatest
      security: []
      x-req: [REQ-AND-001]
      responses:
        '200':
          description: Latest build metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AndroidRelease'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      operationId: login
      security: []
      x-req: [REQ-SEC-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access and refresh tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token
      description: Exchanges a valid refresh token for a new token pair. The old refresh token is revoked (rotation); reuse of a rotated token revokes the whole family.
      operationId: refreshToken
      security: []
      x-req: [REQ-SEC-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Revokes the presented refresh token's session (or all sessions of its user). Holding the refresh token is proof enough, so the bearer is optional and may be expired; unknown or already revoked tokens still give 204.
      operationId: logout
      security:
        - bearerJwt: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/invite:
    post:
      tags: [Auth]
      summary: Invite a member to the household
      description: Admin only. Creates a single-use invite code delivered out of band (WhatsApp or e-mail).
      operationId: createInvite
      x-req: [REQ-SEC-002]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '201':
          description: Invite created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/invite/accept:
    post:
      tags: [Auth]
      summary: Accept an invite and create the member account
      operationId: acceptInvite
      security: []
      x-req: [REQ-SEC-002]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteAcceptRequest'
      responses:
        '201':
          description: Account created; tokens returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Invite expired or already used.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ---------------------------------------------------------------- Expenses
  /api/expenses:
    get:
      tags: [Expenses]
      summary: List expenses
      description: Filterable, sortable, cursor-paginated ledger. Soft-deleted entries are excluded unless `includeDeleted=true`.
      operationId: listExpenses
      x-req: [REQ-EXP-001]
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: memberId
          in: query
          description: Paid-by member.
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          description: Category (includes sub-categories).
          schema:
            type: string
            format: uuid
        - name: merchantId
          in: query
          schema:
            type: string
            format: uuid
        - name: accountId
          in: query
          description: Payment account.
          schema:
            type: string
            format: uuid
        - name: source
          in: query
          schema:
            $ref: '#/components/schemas/MessageSource'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ExpenseStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: minAmountMinor
          in: query
          description: Inclusive lower bound on the base-currency amount, in minor units.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: maxAmountMinor
          in: query
          description: Inclusive upper bound on the base-currency amount, in minor units.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: q
          in: query
          description: Free-text search over merchant, notes, item names and raw message text.
          schema:
            type: string
            maxLength: 200
        - name: includeDeleted
          in: query
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          description: Sort key; prefix with `-` for descending.
          schema:
            type: string
            enum: [occurredAt, -occurredAt, amount, -amount, createdAt, -createdAt]
            default: -occurredAt
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of expenses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpensePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Expenses]
      summary: Create an expense manually
      operationId: createExpense
      x-req: [REQ-EXP-002]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreate'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/expenses/{expenseId}:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
    get:
      tags: [Expenses]
      summary: Get an expense
      operationId: getExpense
      responses:
        '200':
          description: The expense with items, sources and splits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Expenses]
      summary: Update an expense
      description: Partial update. Changing `categoryId` or `merchantId` records a correction and updates merchant rules (learning).
      operationId: updateExpense
      x-req: [REQ-EXP-003]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePatch'
      responses:
        '200':
          description: Updated expense.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Expenses]
      summary: Soft-delete an expense
      description: Sets `deletedAt`; the entry can be restored with `restoreExpense`.
      operationId: deleteExpense
      x-req: [REQ-EXP-004]
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/expenses/{expenseId}/merge:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
    post:
      tags: [Expenses]
      summary: Merge other expenses into this one
      description: The target keeps the authoritative charged amount; merged entries contribute their sources (e.g. receipt line items) and are soft-deleted with status IGNORED.
      operationId: mergeExpenses
      x-req: [REQ-DEDUP-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequest'
      responses:
        '200':
          description: The merged expense.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/expenses/{expenseId}/split:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
    post:
      tags: [Expenses]
      summary: Split an expense between members
      description: Sets `splitMode` and the per-member shares. Shares must sum exactly to the expense amount (no rounding leakage).
      operationId: splitExpense
      x-req: [REQ-EXP-005]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitRequest'
      responses:
        '200':
          description: The expense with its splits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/expenses/{expenseId}/restore:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
    post:
      tags: [Expenses]
      summary: Restore a soft-deleted expense
      operationId: restoreExpense
      x-req: [REQ-EXP-004]
      responses:
        '200':
          description: Restored expense.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '501':
          $ref: '#/components/responses/NotImplemented'

  # ---------------------------------------------------------------- Review
  /api/review:
    get:
      tags: [Review]
      summary: List entries awaiting review
      operationId: listReview
      x-req: [REQ-EXP-006]
      parameters:
        - name: reason
          in: query
          schema:
            $ref: '#/components/schemas/ReviewReason'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Review items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/review/{expenseId}/resolve:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
    post:
      tags: [Review]
      summary: Resolve a review item
      operationId: resolveReview
      x-req: [REQ-EXP-006, REQ-DEDUP-002]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
      responses:
        '200':
          description: Resolved expense.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------- Ingest
  /api/ingest/sms:
    post:
      tags: [Ingest]
      summary: Ingest a bank/wallet SMS
      description: |
        Used by the Android app and the iOS Shortcut. Idempotent on `(deviceId, smsId)`.
        OTP messages must be dropped on-device and are rejected server-side as a second line of defence.
        The server answers `202` as soon as the raw message is persisted; parsing is asynchronous.
      operationId: ingestSms
      security:
        - deviceToken: []
      x-req: [REQ-SMS-001, REQ-IOS-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestSmsRequest'
      responses:
        '202':
          $ref: '#/components/responses/IngestAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/ingest/parsed-transactions:
    post:
      tags: [Ingest]
      summary: Ingest one transaction that the phone parsed on-device (structured only)
      description: |
        Used by the Android app for bank/wallet SMS and bank-app notifications. The message text never leaves
        the phone: the app sends only the structured record below, whose only free-text field is a short
        `merchant` label with every digit removed. Idempotent on `(deviceId, localId)`. The server validates
        strictly (enum kinds, amount bounds, currency, `instrumentLast4`, digit-free label) and answers `422`
        for anything else; it never stores a message body for these records.
      operationId: ingestParsedTransaction
      security:
        - deviceToken: []
      x-req: [REQ-SMS-001, REQ-NTF-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestParsedTransactionRequest'
      responses:
        '202':
          $ref: '#/components/responses/IngestAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/ingest/notification:
    post:
      tags: [Ingest]
      summary: Ingest a bank-app push notification
      description: From the Android `NotificationListenerService`. Idempotent on `(deviceId, notificationKey)`.
      operationId: ingestNotification
      security:
        - deviceToken: []
      x-req: [REQ-NTF-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestNotificationRequest'
      responses:
        '202':
          $ref: '#/components/responses/IngestAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/ingest/receipt:
    post:
      tags: [Ingest]
      summary: Upload a receipt image or PDF
      description: Multipart upload. Content type is sniffed server-side; only JPEG, PNG, HEIC, WEBP and PDF are accepted. Duplicate images (same SHA-256 or perceptual hash) are reported as `DUPLICATE`.
      operationId: ingestReceipt
      security:
        - deviceToken: []
        - bearerJwt: []
      x-req: [REQ-RCPT-001]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IngestReceiptForm'
            encoding:
              file:
                contentType: image/jpeg, image/png, image/heic, image/webp, application/pdf
      responses:
        '202':
          $ref: '#/components/responses/IngestAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          description: Unsupported media type after sniffing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/ingest/text:
    post:
      tags: [Ingest]
      summary: Ingest free text (quick add)
      description: Same parser as WhatsApp text. Used by the Android quick-add widget, the PWA and the iOS Shortcut.
      operationId: ingestText
      security:
        - deviceToken: []
        - bearerJwt: []
      x-req: [REQ-PARSE-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestTextRequest'
      responses:
        '202':
          $ref: '#/components/responses/IngestAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  # ---------------------------------------------------------------- Parsing (dry run)
  /api/parse/dry-run:
    post:
      tags: [Parsing]
      summary: Parse text without persisting anything
      description: |
        Runs normalisation, classification and extraction and returns the structured result.
        No `raw_message` or `expense` is written, no reply is sent. Used by `eval/runners/run.py --adapter http`
        and the "preview before saving" UI. Input is treated strictly as data (S10.5).
      operationId: parseDryRun
      x-req: [REQ-PARSE-001, REQ-PARSE-002]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseRequest'
      responses:
        '200':
          description: Structured parse result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  # ---------------------------------------------------------------- Webhooks
  /webhooks/whatsapp:
    get:
      tags: [Webhooks]
      summary: WhatsApp webhook verification handshake
      description: Meta calls this once when the webhook URL is registered. Echoes `hub.challenge` when `hub.verify_token` matches.
      operationId: verifyWhatsappWebhook
      security: []
      x-req: [REQ-WA-001]
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
            enum: [subscribe]
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The challenge, echoed verbatim.
          content:
            text/plain:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Webhooks]
      summary: Receive WhatsApp events
      description: |
        Every request must carry a valid `X-Hub-Signature-256` (HMAC-SHA256 of the raw body with the app secret).
        The payload is persisted as a `raw_message` and `200` is returned within 1 s; processing is asynchronous.
        Idempotent on the WhatsApp message ID (Meta retries).
      operationId: receiveWhatsappWebhook
      security: []
      x-req: [REQ-WA-002, REQ-SEC-003]
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
